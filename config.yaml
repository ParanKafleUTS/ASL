# ASL Hand Sign Detection Configuration

project:
  name: "ASL Hand Sign Detection"
  version: "1.0.0"
  seed: 42

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  results: "results"
  models: "results/models"
  logs: "results/logs"
  plots: "results/plots"
  metrics: "results/metrics"

data:
  dataset: "jeyasrisenthil/hand-signs-asl-hand-sign-data"
  image_size: 64
  channels: 3
  num_classes: 26  # Auto-detected from directory names; 26 if dataset includes J and Z
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  batch_size: 64
  augmentation: true

augmentation:
  rotation_range: 10
  width_shift_range: 0.1
  height_shift_range: 0.1
  zoom_range: 0.1
  horizontal_flip: false  # Don't flip ASL signs
  fill_mode: "nearest"

models:
  custom_cnn:
    filters: [32, 64, 128]
    kernel_size: 3
    dropout: 0.5
    dense_units: [256, 128]
    learning_rate: 0.001
    epochs: 50

  mobilenet:
    learning_rate: 0.0001
    fine_tune_layers: 30
    epochs: 50
    dropout: 0.3

  efficientnet:
    learning_rate: 0.0001
    fine_tune_layers: 20
    epochs: 50
    dropout: 0.3

  skeleton_gcn:
    hidden_units: [64, 128, 64]
    learning_rate: 0.001
    epochs: 50
    dropout: 0.4

  ensemble:
    method: "weighted_average"
    weights: [0.3, 0.3, 0.2, 0.2]

training:
  early_stopping:
    monitor: "val_accuracy"
    patience: 10
    restore_best_weights: true
  reduce_lr:
    monitor: "val_loss"
    factor: 0.5
    patience: 5
    min_lr: 0.00001
  checkpoint:
    monitor: "val_accuracy"
    save_best_only: true

hyperparameter_tuning:
  max_trials: 20
  executions_per_trial: 1
  objective: "val_accuracy"
  directory: "results/hp_tuning"

evaluation:
  confidence_intervals: true
  bootstrap_samples: 1000
  significance_level: 0.05
  cross_validation_folds: 5

web:
  host: "0.0.0.0"
  port: 5000
  debug: false
  model_path: "results/models/best_model.h5"
